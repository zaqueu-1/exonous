name: Sync from upstream

# Runs only on the quanthub mirror (if guard below) — pulls main + tags from the canonical repo.
# Configure on the mirror repo (Settings → Secrets → Actions):
#   UPSTREAM_TOKEN (optional) — only if zaqueu-1/exonous is private
#
# On zaqueu-1/exonous this job is skipped (if guard below).

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'quanthubbr/tron-claude-config'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward from canonical upstream
        env:
          UPSTREAM_REPO: zaqueu-1/exonous
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${UPSTREAM_TOKEN}" ]; then
            UPSTREAM_URL="https://x-access-token:${UPSTREAM_TOKEN}@github.com/${UPSTREAM_REPO}.git"
          else
            UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}.git"
          fi
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream main --tags
          git checkout main
          git merge --ff-only upstream/main
          git push origin main
          git push origin --tags || true
