name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a main run: it may be tagging a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
        include:
          - os: ubuntu-latest
            node: 18
    defaults:
      run:
        # Git Bash on Windows: expands test/*.test.js (pwsh/cmd hand node the literal glob).
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # repo-migrate regenerates the v2 manifest from the v2.0.0 tag.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        env:
          EXONOUS_HOME: ${{ runner.temp }}/exonous-home
          HOME: ${{ runner.temp }}/home
          USERPROFILE: ${{ runner.temp }}/home
          EXONOUS_NO_UPDATE: '1'
          # Git for Windows maps this literal itself; NUL fails its config access check.
          GIT_CONFIG_GLOBAL: /dev/null
        # Same as `npm test`, run directly: npm uses cmd.exe on Windows, which leaves the glob unexpanded.
        run: |
          mkdir -p "$EXONOUS_HOME" "$HOME"
          node --version
          node --test test/*.test.js

  wsl:
    name: test (wsl ubuntu-24.04)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # repo-migrate regenerates the v2 manifest from the v2.0.0 tag.
          fetch-depth: 0

      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: nodejs git

      - name: Test
        shell: wsl-bash {0}
        # Copy to the Linux filesystem: /mnt/* (drvfs) has no POSIX modes and is slow. Windows env vars do not cross into WSL, so export them here.
        run: |
          set -euo pipefail
          node --version
          src="$(pwd)"
          work="$(mktemp -d)"
          cp -r "$src" "$work/repo"
          cd "$work/repo"
          find . -path ./.git -prune -o -type f -exec chmod 644 {} +
          git -c safe.directory='*' ls-files -s | awk '$1 == "100755" { print $4 }' | xargs -r chmod 755
          export EXONOUS_HOME="$work/exonous-home" HOME="$work/home" EXONOUS_NO_UPDATE=1 GIT_CONFIG_GLOBAL=/dev/null
          mkdir -p "$EXONOUS_HOME" "$HOME"
          node --test test/*.test.js

  version:
    name: version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Shipped changes raise the version
        env:
          BASE: ${{ github.base_ref }}
        run: node maintainer/release.js check "origin/$BASE"

  release-checks:
    name: release checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, wsl]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: New version?
        id: version
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ -n "$(git tag --list "v$v")" ]; then echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$v already released"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - name: Pre-release checks
        if: steps.version.outputs.new == 'true'
        run: |
          bash maintainer/e2e-smoke.sh
          npm run pege:originality

  # Only this job can write, and it runs nothing but the tag step.
  release:
    name: release tag
    needs: release-checks
    if: needs.release-checks.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The quanthub mirror copies new tags within the hour (its own sync workflow).
      - name: Tag the release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node maintainer/release.js tag
