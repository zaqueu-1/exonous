name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a main run: it may be tagging a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
        include:
          - os: ubuntu-latest
            node: 18
    defaults:
      run:
        # Git Bash on Windows: expands test/*.test.js (pwsh/cmd hand node the literal glob).
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # repo-migrate regenerates the v2 manifest from the v2.0.0 tag.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        env:
          EXONOUS_HOME: ${{ runner.temp }}/exonous-home
          HOME: ${{ runner.temp }}/home
          USERPROFILE: ${{ runner.temp }}/home
          EXONOUS_NO_UPDATE: '1'
          # Git for Windows maps this literal itself; NUL fails its config access check.
          GIT_CONFIG_GLOBAL: /dev/null
        # Same as `npm test`, run directly: npm uses cmd.exe on Windows, which leaves the glob unexpanded.
        run: |
          mkdir -p "$EXONOUS_HOME" "$HOME"
          node --version
          node --test test/*.test.js

  wsl:
    name: test (wsl ubuntu-24.04)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # repo-migrate regenerates the v2 manifest from the v2.0.0 tag.
          fetch-depth: 0

      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-conf: |
            [network]
            generateResolvConf = false

      # The generated resolv.conf (host DNS proxy) flakes on windows-latest; pin public resolvers and retry apt.
      - name: Install packages
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          rm -f /etc/resolv.conf
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /etc/resolv.conf
          for i in 1 2 3 4 5; do
            if apt-get -o Acquire::Retries=3 update && apt-get -o Acquire::Retries=3 install --yes --no-install-recommends nodejs npm git python3; then exit 0; fi
            echo "apt attempt $i failed, retrying"; sleep $((i * 10))
          done
          exit 1

      - name: Test
        shell: wsl-bash {0}
        # Copy to the Linux filesystem: /mnt/* (drvfs) has no POSIX modes and is slow. Windows env vars do not cross into WSL, so export them here.
        run: |
          set -euo pipefail
          node --version
          src="$(pwd)"
          work="$(mktemp -d)"
          cp -r "$src" "$work/repo"
          cd "$work/repo"
          find . -path ./.git -prune -o -type f -exec chmod 644 {} +
          git -c safe.directory='*' ls-files -s | awk '$1 == "100755" { print $4 }' | xargs -r chmod 755
          export EXONOUS_HOME="$work/exonous-home" HOME="$work/home" EXONOUS_NO_UPDATE=1 GIT_CONFIG_GLOBAL=/dev/null
          mkdir -p "$EXONOUS_HOME" "$HOME"
          node --test test/*.test.js

  # PR: preview the bump. main: commit it (feat → minor, `!`/BREAKING → major, else patch; docs never), later jobs build that sha.
  version:
    name: version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Preview the bump this PR gets on merge
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: node maintainer/release.js check "origin/$BASE"

      - name: Bump and push the version
        id: bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch origin main
          # A newer merge is queued behind this run; its run bumps for both.
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then echo "main moved past $GITHUB_SHA, bump left to its run"; exit 0; fi
          node maintainer/release.js bump
          git diff --quiet -- package.json && exit 0
          v="$(node -p "require('./package.json').version")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json
          git commit -m "chore: release v$v"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release-checks:
    name: release checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, test, wsl, npm-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: New version?
        id: version
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ -n "$(git tag --list "v$v")" ]; then echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$v already released"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - name: Pre-release checks
        if: steps.version.outputs.new == 'true'
        env:
          EXONOUS_SOURCE_01_URL: ${{ secrets.EXONOUS_SOURCE_01_URL }}
          EXONOUS_SOURCE_02_URL: ${{ secrets.EXONOUS_SOURCE_02_URL }}
          EXONOUS_SOURCE_03_URL: ${{ secrets.EXONOUS_SOURCE_03_URL }}
          EXONOUS_SOURCE_04_URL: ${{ secrets.EXONOUS_SOURCE_04_URL }}
          EXONOUS_SOURCE_05_URL: ${{ secrets.EXONOUS_SOURCE_05_URL }}
          EXONOUS_SOURCE_06_URL: ${{ secrets.EXONOUS_SOURCE_06_URL }}
          EXONOUS_SOURCE_07_URL: ${{ secrets.EXONOUS_SOURCE_07_URL }}
          EXONOUS_SOURCE_08_URL: ${{ secrets.EXONOUS_SOURCE_08_URL }}
          EXONOUS_SOURCE_09_URL: ${{ secrets.EXONOUS_SOURCE_09_URL }}
          EXONOUS_SOURCE_10_URL: ${{ secrets.EXONOUS_SOURCE_10_URL }}
          EXONOUS_SOURCE_11_URL: ${{ secrets.EXONOUS_SOURCE_11_URL }}
          EXONOUS_SOURCE_12_URL: ${{ secrets.EXONOUS_SOURCE_12_URL }}
          EXONOUS_SOURCE_13_URL: ${{ secrets.EXONOUS_SOURCE_13_URL }}
          EXONOUS_SOURCE_14_URL: ${{ secrets.EXONOUS_SOURCE_14_URL }}
          EXONOUS_SOURCE_15_URL: ${{ secrets.EXONOUS_SOURCE_15_URL }}
        run: |
          bash maintainer/e2e-smoke.sh
          npm run pege:originality

  npm-package:
    name: pack npm package
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Pack the exact tarball every later job uses
        run: |
          mkdir -p dist
          npm pack --pack-destination dist --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-package
          path: dist/
          retention-days: 7
          if-no-files-found: error

  npm-smoke:
    name: npm install (${{ matrix.os }})
    needs: npm-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-package
          path: dist
      - name: Install the packed tarball globally and wire a temp home
        env:
          EXONOUS_HOME: ${{ runner.temp }}/exonous-home
          HOME: ${{ runner.temp }}/home
          USERPROFILE: ${{ runner.temp }}/home
          EXONOUS_NO_UPDATE: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          package="$(find ./dist -name '*.tgz' -print)"
          prefix="$RUNNER_TEMP/npm-prefix"
          mkdir -p "$EXONOUS_HOME" "$HOME" "$prefix"
          npm install --global --prefix "$prefix" --ignore-scripts --no-audit --no-fund "$package"
          if [ '${{ runner.os }}' = Windows ]; then bin="$prefix/exonous.cmd"; else bin="$prefix/bin/exonous"; fi
          "$bin" help | grep -q 'pr create'
          "$bin" install --quiet --tools claude
          "$bin" gate --selftest claude

  release:
    name: publish npm then release notes
    needs: [version, release-checks, npm-package, npm-smoke]
    if: needs.release-checks.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-package
          path: dist
      - name: Publish or verify the exact packed tarball
        run: |
          set -euo pipefail
          npm install --global npm@11.6.2 --ignore-scripts
          v="$(node -p "require('./package.json').version")"
          package="./dist/exonous-$v.tgz"
          local_sri="sha512-$(openssl dgst -sha512 -binary "$package" | base64 -w0)"
          if ! npm view "exonous@$v" version >/dev/null 2>&1; then
            npm publish "$package" --ignore-scripts --access public --provenance
          fi
          # The registry takes minutes to serve a fresh version; poll instead of failing on the first 404.
          published_sri=""
          for i in $(seq 1 24); do
            published_sri="$(npm view "exonous@$v" dist.integrity --prefer-online 2>/dev/null || true)"
            [ -n "$published_sri" ] && break
            echo "exonous@$v not visible on npm yet ($i/24)"; sleep 15
          done
          if [ -z "$published_sri" ]; then echo "exonous@$v never appeared on npm" >&2; exit 1; fi
          if [ "$published_sri" != "$local_sri" ]; then echo "exonous@$v on npm differs from the validated tarball" >&2; exit 1; fi
      - name: Tag verified npm release and publish notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node maintainer/release.js tag
          v="$(node -p "require('./package.json').version")"
          if ! gh release view "v$v" >/dev/null 2>&1; then gh release create "v$v" --verify-tag --title "Exonous v$v" --generate-notes; fi
